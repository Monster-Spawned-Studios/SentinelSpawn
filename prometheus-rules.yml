groups:
  - name: suricata_critical_alerts
    interval: 30s
    rules:
      - alert: HighCriticalAlerts
        expr: sum(rate(suricata_alerts_total{severity="1"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High rate of critical Suricata alerts"
          description: "More than 5 critical alerts per minute for 2 minutes. Possible active breach or DoS attack."

      - alert: CriticalC2Detected
        expr: sum(increase(suricata_alerts_total{category=~".*Command and Control.*"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Command & Control activity detected"
          description: "Suricata detected C2 communication. Immediate investigation required."
