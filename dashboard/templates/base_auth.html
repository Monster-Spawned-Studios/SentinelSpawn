<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}SentinelSpawn{% endblock %} • SentinelSpawn</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <main class="auth-wrap">
        <section class="auth-card">
            <header class="auth-head">
                <div class="brand">
                    <span class="logo" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg>
                    </span>
                    <span>
                        <span class="name">SentinelSpawn</span>
                        <span class="sub">Command Center</span>
                    </span>
                </div>
                <div>
                    <h1 class="auth-title">{% block heading %}{% endblock %}</h1>
                    <p class="auth-subtitle">{% block subtitle %}{% endblock %}</p>
                </div>
            </header>

            {% if error %}
            <div class="alert" role="alert" aria-live="polite">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% block content %}{% endblock %}

            <p class="auth-foot">Monster Spawned Studios • Network Security &amp; Privacy Stack</p>
        </section>
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
