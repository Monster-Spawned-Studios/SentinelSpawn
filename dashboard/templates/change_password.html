<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
</head>
<body>
    <h1>Change Password for {{ user }}</h1>
    {% if error %}<p role="alert" aria-live="polite">{{ error }}</p>{% endif %}
    <form method="post" action="/change-password">
        <label for="new_password">New Password</label>
        <input id="new_password" type="password" name="new_password" required><br>
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" required><br>
        <button type="submit">Update Password</button>
    </form>
</body>
</html>
